name: Importar novas cifras
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/importar-novas-cifras.yml"]

permissions:
  contents: write

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Criar arquivo de novas cifras
        shell: bash
        run: |
          python - <<'PY'
          import base64,gzip,pathlib
          data = """[... ELLIPSIZATION ...]"""
          raw = gzip.decompress(base64.b64decode(data))
          p = pathlib.Path("assets/js/novas-musicas-20261107.js")
          p.write_bytes(raw)
          PY
      - name: Commitar lote
        run: |
          git config user.name "AcordeEDU Bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/js/novas-musicas-20261107.js
          git commit -m "Importar novas cifras enviadas" || exit 0
          git push
