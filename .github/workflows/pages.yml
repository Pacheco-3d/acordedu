name: Publicar AcordeEDU
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Validar arquivos completos
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s assets/js/app.js
          test -s assets/js/importadas.js
          test -s assets/js/catolicas.js
          test -s assets/js/data.js
          test -s assets/css/style.css
          test -s musicas/cifra.html
          test -s musicas/index.html
          test -s artistas/index.html
          grep -q 'ACORDE_IMPORTADAS' assets/js/importadas.js
          for file in assets/js/*.js; do node --check "$file"; done
          for page in $(find . -path './teste-versao-7z' -prune -o -name '*.html' -print); do
            grep -q 'assets/js/importadas.js' "$page" || { echo "Missing importadas.js on $page"; exit 1; }
          done
          mkdir -p _site
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='_site/' --exclude='*.zip' --exclude='*.7z' --exclude='*.md' --exclude='*.txt' ./ _site/
          touch _site/.nojekyll
          test -s _site/index.html
      - name: Enviar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
