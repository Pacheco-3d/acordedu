name: Publicar AcordeEDU
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Extrair versao completa do AcordeEDU
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site _unpacked
          if [ -f acordedu-site.zip ]; then
            PACKAGE="acordedu-site.zip"
          elif [ -f acordeedu___v010.zip ]; then
            PACKAGE="acordeedu___v010.zip"
          else
            echo "::error::Envie acordedu-site.zip ou acordeedu___v010.zip na raiz do repositorio"
            exit 1
          fi
          echo "Publicando pacote: $PACKAGE"
          unzip -q "$PACKAGE" -d _unpacked
          if [ -f _unpacked/index.html ]; then
            SOURCE="_unpacked"
          elif [ -f _unpacked/acorde-studio-html/index.html ]; then
            SOURCE="_unpacked/acorde-studio-html"
          else
            echo "::error::index.html nao encontrado na raiz nem em acorde-studio-html/"
            exit 1
          fi
          cp -a "$SOURCE"/. _site/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/assets/js/app.js
          test -s _site/assets/js/data.js
          test -s _site/assets/js/catolicas.js
          test -s _site/assets/css/style.css
          test -s _site/artistas/index.html
          test -s _site/musicas/index.html
          test -s _site/musicas/cifra.html
          test -s _site/repertorio/index.html
          test -s _site/login/index.html
          test -s _site/categorias/catolica/index.html
          for file in _site/assets/js/*.js; do node --check "$file"; done
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlsplit, unquote
          root = Path("_site")
          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.refs = []
              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  for key in ("href", "src", "action"):
                      value = values.get(key)
                      if value and tag in ("a", "img", "script", "link", "source", "form"):
                          self.refs.append(value)
          missing = []
          pages = list(root.rglob("*.html"))
          for page in pages:
              parser = Links()
              parser.feed(page.read_text(encoding="utf-8-sig"))
              for ref in parser.refs:
                  u = urlsplit(ref)
                  if u.scheme or u.netloc or not u.path or ref.startswith(("#", "//")):
                      continue
                  target = root / unquote(u.path).lstrip("/") if u.path.startswith("/") else page.parent / unquote(u.path)
                  if target.is_dir():
                      target = target / "index.html"
                  if not target.is_file():
                      missing.append(f"{page}: {ref}")
          if len(pages) < 15 or missing:
              raise SystemExit(f"Expected 15 HTML pages; got {len(pages)}. Broken local links: {missing[:20]}")
          print(f"Validated {len(pages)} HTML pages, assets and local links")
          PY
      - name: Enviar site ao GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
