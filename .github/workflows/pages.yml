name: Publicar AcordeEDU
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Preparar site completo
        shell: bash
        run: |
          mkdir -p _site
          if [ -f acordeedu-site.zip ]; then
            unzip -q acordeedu-site.zip -d _site
          else
            cp index.html _site/
            cp -a assets _site/
            touch _site/.nojekyll
          fi
          test -f _site/index.html
      - name: Enviar arquivos para o Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
